<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME TORUS MANIFOLD (T²) // WEBGL & AUDIO CANVAS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #05050A;
            color: #00FFCC;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(8, 10, 18, 0.86);
            border: 1px solid #1E3352;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 28px rgba(0, 255, 204, 0.14);
            backdrop-filter: blur(10px);
            width: 335px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .ui-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-14px);
        }
        h1 {
            font-size: 13px;
            letter-spacing: 1.6px;
            color: #00FFCC;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 10px;
            color: #FF007F;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #93A5B8;
            margin-bottom: 4px;
        }
        input[type=range] {
            width: 100%;
            accent-color: #00FFCC;
            background: #121C2B;
            height: 4px;
            border-radius: 2px;
            cursor: pointer;
        }
        .audio-btn {
            width: 100%;
            padding: 9px 10px;
            margin-top: 2px;
            margin-bottom: 14px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00FFCC;
            color: #00FFCC;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.9px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .audio-btn:hover {
            background: rgba(0, 255, 204, 0.24);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.35);
        }
        .audio-btn.active {
            background: rgba(255, 0, 127, 0.22);
            border-color: #FF007F;
            color: #FF007F;
        }
        .telemetry {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #162438;
            font-size: 10px;
            color: #FFD700;
            line-height: 1.65;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00FFCC;
            border-radius: 3px;
            color: #00FFCC;
            font-size: 9px;
            margin-top: 6px;
        }
        .hotkey-bar {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #1E3352;
            font-size: 9px;
            color: #6E8299;
            display: flex;
            justify-content: space-between;
        }
        .hotkey-bar span b {
            color: #00FFCC;
        }
        #hud-pill {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 12;
            padding: 5px 10px;
            background: rgba(8, 10, 18, 0.75);
            border: 1px solid rgba(255, 215, 0, 0.45);
            border-radius: 4px;
            color: #FFD700;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        #hud-pill:hover {
            border-color: #00FFCC;
            color: #00FFCC;
        }
        #rec-indicator {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 12;
            padding: 6px 12px;
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #FF007F;
            border-radius: 4px;
            color: #FF007F;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <button id="hud-pill" title="Toggle HUD [H]">HUD [H]</button>
    <div id="rec-indicator">● REC 5.0s LOOP...</div>

    <div class="ui-panel" id="ui-panel">
        <h1>Prime Torus Manifold</h1>
        <h2>Phase-Lock Winding Orbit (T²)</h2>

        <button id="btn-audio" class="audio-btn">🔊 INITIALIZE AUDIO SYNTHESIZER</button>

        <div class="control-group">
            <label>Prime Brood P (p): <span id="val-p">13</span></label>
            <input type="range" id="slider-p" min="1" max="31" step="1" value="13">
        </div>

        <div class="control-group">
            <label>Prime Brood Q (q): <span id="val-q">17</span></label>
            <input type="range" id="slider-q" min="1" max="37" step="1" value="17">
        </div>

        <div class="control-group">
            <label>Phase Velocity (τ): <span id="val-speed">1.0</span></label>
            <input type="range" id="slider-speed" min="0" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>Knot Tube Radius (r): <span id="val-tube">0.028</span></label>
            <input type="range" id="slider-tube" min="0.01" max="0.075" step="0.002" value="0.028">
        </div>

        <div class="telemetry">
            <div>Winding Ratio: <span id="tele-ratio">13 / 17 (Prime Coprime)</span></div>
            <div>Carrier Anchor: <span id="tele-freq-p">65.4 Hz</span> ⊗ <span id="tele-freq-q">65.4 Hz</span></div>
            <div>Fundamental Group: π₁(T²) = ℤ ⊕ ℤ | Ω = 0</div>
            <div class="status-badge" id="tele-coprime">STATE: COPRIME PHASE LOCK</div>
        </div>

        <div class="hotkey-bar">
            <span><b>[H]</b> HUD</span>
            <span><b>[C]</b> ORBIT</span>
            <span><b>[S]</b> PNG</span>
            <span><b>[R]</b> 5s CLIP</span>
        </div>
    </div>

    <script>
        // --- 1. PARAMETRIC KNOT CURVE CLASS ---
        class PrimeTorusKnotCurve extends THREE.Curve {
            constructor(p = 13, q = 17, R = 2.5, r = 0.9) {
                super();
                this.p = p;
                this.q = q;
                this.R = R;
                this.r = r;
            }
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const theta = t * Math.PI * 2;
                const x = (this.R + this.r * Math.cos(this.q * theta)) * Math.cos(this.p * theta);
                const y = (this.R + this.r * Math.cos(this.q * theta)) * Math.sin(this.p * theta);
                const z = this.r * Math.sin(this.q * theta);
                return optionalTarget.set(x, y, z);
            }
        }

        // --- 2. THREE.JS SCENE SETUP (ACES FILMIC + CAPTURE BUFFER) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);
        scene.fog = new THREE.FogExp2(0x05050a, 0.045);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.4, 6.8);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            preserveDrawingBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.65;

        controls.addEventListener('start', () => {
            controls.autoRotate = false;
        });

        // Master group shifted slightly right on desktop so UI panel never overlaps the torus
        const masterGroup = new THREE.Group();
        function updateLayoutOffset() {
            const panelHidden = document.getElementById('ui-panel').classList.contains('hidden');
            masterGroup.position.x = (!panelHidden && window.innerWidth > 900) ? 1.15 : 0.0;
        }
        updateLayoutOffset();
        scene.add(masterGroup);

        // --- PROCEDURAL RADIAL GLOW TEXTURE ---
        function createGlowTexture(hexColor) {
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 2, 64, 64, 62);
            grad.addColorStop(0.0, '#FFFFFF');
            grad.addColorStop(0.24, hexColor);
            grad.addColorStop(0.62, hexColor + '55');
            grad.addColorStop(1.0, 'rgba(5, 5, 10, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }
        const glowTexGold = createGlowTexture('#FFD700');

        // --- 3. LIGHTING ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.42));

        const pointLight1 = new THREE.PointLight(0x00ffcc, 2.5, 25);
        pointLight1.position.set(4, 5, 4);
        masterGroup.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff007f, 2.5, 25);
        pointLight2.position.set(-4, -5, -4);
        masterGroup.add(pointLight2);

        const pointLightGold = new THREE.PointLight(0xffd700, 2.2, 12);
        masterGroup.add(pointLightGold);

        // --- 4. DIELECTRIC FRESNEL GLASS TORUS SHELL + WIREFRAME LATTICE ---
        const R_major = 2.5;
        const r_minor = 0.92;

        const torusWireGeo = new THREE.TorusGeometry(R_major, r_minor, 28, 72);
        const torusWireMat = new THREE.MeshBasicMaterial({
            color: 0x162942,
            wireframe: true,
            transparent: true,
            opacity: 0.22
        });
        const torusMesh = new THREE.Mesh(torusWireGeo, torusWireMat);
        torusMesh.rotation.x = Math.PI / 2;
        masterGroup.add(torusMesh);

        // Smooth Dielectric Fresnel Containment Shell around T²
        const torusGlassUniforms = {
            uTime: { value: 0.0 },
            uCoprime: { value: 1.0 },
            uColorCyan: { value: new THREE.Color(0x00ffcc) },
            uColorMagenta: { value: new THREE.Color(0xff007f) }
        };

        const torusGlassMat = new THREE.ShaderMaterial({
            uniforms: torusGlassUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.FrontSide,
            vertexShader: `
                varying vec3 vWorldNormal;
                varying vec3 vWorldPos;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    vWorldNormal = normalize(mat3(modelMatrix) * normal);
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uCoprime;
                uniform vec3 uColorCyan;
                uniform vec3 uColorMagenta;
                varying vec3 vWorldNormal;
                varying vec3 vWorldPos;
                varying vec2 vUv;

                void main() {
                    vec3 N = normalize(vWorldNormal);
                    vec3 V = normalize(cameraPosition - vWorldPos);
                    float fresnel = pow(1.0 - abs(dot(N, V)), 3.0);

                    float uGrid = smoothstep(0.95, 1.0, abs(sin(vUv.x * 3.14159 * 17.0)));
                    float vGrid = smoothstep(0.95, 1.0, abs(sin(vUv.y * 3.14159 * 13.0)));
                    float grid = max(uGrid, vGrid) * 0.25;

                    vec3 rimCol = mix(uColorMagenta, uColorCyan, 0.5 + 0.5 * sin(vUv.x * 6.28318 * 2.0 - uTime * 0.6));
                    rimCol = mix(uColorMagenta, rimCol, uCoprime);

                    float alpha = clamp(fresnel * 0.48 + grid * fresnel, 0.0, 0.72);
                    gl_FragColor = vec4(rimCol * (1.1 + grid), alpha);
                }
            `
        });

        const torusGlassMesh = new THREE.Mesh(
            new THREE.TorusGeometry(R_major, r_minor + 0.05, 48, 128),
            torusGlassMat
        );
        torusGlassMesh.rotation.x = Math.PI / 2;
        masterGroup.add(torusGlassMesh);

        // --- 5. EQUATORIAL 360° ASTROLABE RETICLE ---
        function buildTorusAstrolabe() {
            const group = new THREE.Group();
            [1.35, 3.72].forEach((rad) => {
                const ringGeo = new THREE.RingGeometry(rad - 0.007, rad + 0.007, 128);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0x223d61,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.55
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                group.add(ring);
            });

            const pts = [];
            for (let deg = 0; deg < 360; deg += 10) {
                const a = (deg * Math.PI) / 180;
                const rIn = deg % 30 === 0 ? 3.58 : 3.65;
                pts.push(
                    new THREE.Vector3(Math.cos(a) * rIn, 0, Math.sin(a) * rIn),
                    new THREE.Vector3(Math.cos(a) * 3.72, 0, Math.sin(a) * 3.72)
                );
            }
            pts.push(
                new THREE.Vector3(-3.95, 0, 0), new THREE.Vector3(3.95, 0, 0),
                new THREE.Vector3(0, 0, -3.95), new THREE.Vector3(0, 0, 3.95)
            );
            const tickGeo = new THREE.BufferGeometry().setFromPoints(pts);
            const tickMat = new THREE.LineBasicMaterial({ color: 0x2b507a, transparent: true, opacity: 0.5 });
            group.add(new THREE.LineSegments(tickGeo, tickMat));
            return group;
        }
        masterGroup.add(buildTorusAstrolabe());

        // --- 6. BIPHASE VERTEX-COLORED PRIME KNOT + GOLDEN SINGULARITY TRAIL ---
        let currentP = 13;
        let currentQ = 17;
        let tubeRadius = 0.028;
        let knotMesh = null;

        const knotGroup = new THREE.Group();
        knotGroup.rotation.x = Math.PI / 2; // Align knot plane cleanly with equatorial T² torus
        masterGroup.add(knotGroup);

        function buildKnotGeometry() {
            if (knotMesh) {
                knotGroup.remove(knotMesh);
                knotMesh.geometry.dispose();
            }

            const tubularSegments = 1400;
            const radialSegments = 12;
            const knotCurve = new PrimeTorusKnotCurve(currentP, currentQ, R_major, r_minor - 0.02);
            const tubeGeo = new THREE.TubeGeometry(knotCurve, tubularSegments, tubeRadius, radialSegments, true);

            // Apply biphase Cyan (#00FFCC) / Magenta (#FF007F) harmonic interference colors along u
            const posAttr = tubeGeo.attributes.position;
            const colors = new Float32Array(posAttr.count * 3);
            const colCyan = new THREE.Color(0x00ffcc);
            const colMagenta = new THREE.Color(0xff007f);
            const colGold = new THREE.Color(0xffd700);
            const tmpCol = new THREE.Color();

            const vertsPerRing = radialSegments + 1;
            for (let i = 0; i <= tubularSegments; i++) {
                const u = i / tubularSegments;
                const theta = u * Math.PI * 2;
                const phaseMix = 0.5 + 0.5 * Math.sin(currentP * theta + Math.cos(currentQ * theta));
                const nodePeak = Math.pow(Math.max(0.0, Math.cos((currentP + currentQ) * 0.5 * theta)), 12.0);

                tmpCol.copy(colCyan).lerp(colMagenta, phaseMix);
                tmpCol.lerp(colGold, nodePeak * 0.45);

                for (let j = 0; j < vertsPerRing; j++) {
                    const idx = (i * vertsPerRing + j) * 3;
                    colors[idx] = tmpCol.r;
                    colors[idx + 1] = tmpCol.g;
                    colors[idx + 2] = tmpCol.b;
                }
            }
            tubeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const tubeMat = new THREE.MeshStandardMaterial({
                vertexColors: true,
                emissive: 0x112233,
                emissiveIntensity: 0.45,
                roughness: 0.18,
                metalness: 0.75
            });

            knotMesh = new THREE.Mesh(tubeGeo, tubeMat);
            knotGroup.add(knotMesh);
        }

        // Golden Phase-Origin Singularity + Glow Halo + 36-Segment Comet Trail
        const originGeo = new THREE.SphereGeometry(0.10, 24, 24);
        const originMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        const originMarker = new THREE.Mesh(originGeo, originMat);

        const originHalo = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTexGold,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9,
            depthWrite: false
        }));
        originHalo.scale.set(0.85, 0.85, 1.0);
        originMarker.add(originHalo);
        knotGroup.add(originMarker);

        const TRAIL_LEN = 36;
        const trailPoints = Array.from({ length: TRAIL_LEN }, () => new THREE.Vector3());
        const trailPositions = new Float32Array(TRAIL_LEN * 3);
        const trailColors = new Float32Array(TRAIL_LEN * 3);
        const goldBase = new THREE.Color(0xffd700);
        const voidBase = new THREE.Color(0x05050a);

        for (let s = 0; s < TRAIL_LEN; s++) {
            const fade = Math.pow(1.0 - s / (TRAIL_LEN - 1), 1.6);
            const c = voidBase.clone().lerp(goldBase, fade);
            trailColors[s * 3] = c.r;
            trailColors[s * 3 + 1] = c.g;
            trailColors[s * 3 + 2] = c.b;
        }
        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
        const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending
        }));
        knotGroup.add(trailLine);

        function resetOriginTrail(uNow) {
            const curve = new PrimeTorusKnotCurve(currentP, currentQ, R_major, r_minor - 0.02);
            const pt = curve.getPoint(uNow % 1);
            for (let s = 0; s < TRAIL_LEN; s++) {
                trailPoints[s].copy(pt);
                trailPositions[s * 3] = pt.x;
                trailPositions[s * 3 + 1] = pt.y;
                trailPositions[s * 3 + 2] = pt.z;
            }
            trailGeo.attributes.position.needsUpdate = true;
        }

        buildKnotGeometry();
        resetOriginTrail(0);

        // --- 7. WEB AUDIO API SYNTHESIZER ---
        let audioCtx = null;
        let oscP = null, oscQ = null;
        let gainNode = null;
        let isAudioPlaying = false;
        const baseFreq = 65.41; // C2 fundamental anchor

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);

            oscP = audioCtx.createOscillator();
            oscQ = audioCtx.createOscillator();

            oscP.type = 'sawtooth';
            oscQ.type = 'sine';

            updateAudioFrequencies();

            oscP.connect(gainNode);
            oscQ.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscP.start();
            oscQ.start();
            isAudioPlaying = true;
        }

        function updateAudioFrequencies() {
            if (!audioCtx) return;
            const freqP = baseFreq * (currentP / 13);
            const freqQ = baseFreq * (currentQ / 17);

            oscP.frequency.setTargetAtTime(freqP, audioCtx.currentTime, 0.05);
            oscQ.frequency.setTargetAtTime(freqQ, audioCtx.currentTime, 0.05);

            document.getElementById('tele-freq-p').innerText = `${freqP.toFixed(1)} Hz`;
            document.getElementById('tele-freq-q').innerText = `${freqQ.toFixed(1)} Hz`;
        }

        const btnAudio = document.getElementById('btn-audio');
        btnAudio.addEventListener('click', () => {
            if (!audioCtx) {
                initAudio();
                btnAudio.innerText = "🔇 MUTE AUDIO SYNTHESIZER";
                btnAudio.classList.add('active');
            } else if (isAudioPlaying) {
                audioCtx.suspend();
                isAudioPlaying = false;
                btnAudio.innerText = "🔊 INITIALIZE AUDIO SYNTHESIZER";
                btnAudio.classList.remove('active');
            } else {
                audioCtx.resume();
                isAudioPlaying = true;
                btnAudio.innerText = "🔇 MUTE AUDIO SYNTHESIZER";
                btnAudio.classList.add('active');
            }
        });

        // --- 8. UI EVENT LISTENERS & STUDIO HOTKEYS ---
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        const sliderP = document.getElementById('slider-p');
        const sliderQ = document.getElementById('slider-q');
        const sliderSpeed = document.getElementById('slider-speed');
        const sliderTube = document.getElementById('slider-tube');

        const valP = document.getElementById('val-p');
        const valQ = document.getElementById('val-q');
        const valSpeed = document.getElementById('val-speed');
        const valTube = document.getElementById('val-tube');
        const teleRatio = document.getElementById('tele-ratio');
        const teleCoprime = document.getElementById('tele-coprime');
        const uiPanel = document.getElementById('ui-panel');
        const hudPill = document.getElementById('hud-pill');
        const recIndicator = document.getElementById('rec-indicator');

        let simTime = 0.0;

        function updateKnot() {
            currentP = parseInt(sliderP.value);
            currentQ = parseInt(sliderQ.value);
            tubeRadius = parseFloat(sliderTube.value);

            valP.innerText = currentP;
            valQ.innerText = currentQ;
            valTube.innerText = tubeRadius.toFixed(3);
            teleRatio.innerText = `${currentP} / ${currentQ}`;

            const isCoprime = gcd(currentP, currentQ) === 1;
            torusGlassUniforms.uCoprime.value = isCoprime ? 1.0 : 0.0;

            if (isCoprime) {
                teleCoprime.innerText = "STATE: COPRIME PHASE LOCK";
                teleCoprime.style.borderColor = "#00FFCC";
                teleCoprime.style.color = "#00FFCC";
            } else {
                teleCoprime.innerText = "STATE: RESONANT COLLAPSE (DEGENERATE)";
                teleCoprime.style.borderColor = "#FF007F";
                teleCoprime.style.color = "#FF007F";
            }

            buildKnotGeometry();
            resetOriginTrail(simTime * 0.06);
            updateAudioFrequencies();
        }

        sliderP.addEventListener('input', updateKnot);
        sliderQ.addEventListener('input', updateKnot);
        sliderTube.addEventListener('input', updateKnot);
        sliderSpeed.addEventListener('input', () => {
            valSpeed.innerText = parseFloat(sliderSpeed.value).toFixed(1);
        });

        function toggleHud() {
            uiPanel.classList.toggle('hidden');
            updateLayoutOffset();
        }
        hudPill.addEventListener('click', toggleHud);

        let isRecording = false;
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const key = e.key.toLowerCase();

            // [H] Toggle HUD
            if (key === 'h') {
                toggleHud();
            }

            // [C] Toggle Cinematic Auto-Orbit
            if (key === 'c') {
                controls.autoRotate = !controls.autoRotate;
            }

            // [S] Clean HUD-Free PNG Export
            if (key === 's') {
                const wasVisible = !uiPanel.classList.contains('hidden');
                uiPanel.classList.add('hidden');
                hudPill.style.display = 'none';
                updateLayoutOffset();

                requestAnimationFrame(() => {
                    renderer.render(scene, camera);
                    renderer.domElement.toBlob((blob) => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `prime-torus-manifold-${Date.now()}.png`;
                        a.click();
                        URL.revokeObjectURL(a.href);

                        if (wasVisible) uiPanel.classList.remove('hidden');
                        hudPill.style.display = '';
                        updateLayoutOffset();
                    }, 'image/png');
                });
            }

            // [R] Record 5-Second Seamless Video Loop (.webm)
            if (key === 'r' && !isRecording) {
                isRecording = true;
                recIndicator.style.display = 'block';
                const stream = renderer.domElement.captureStream(30);
                const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                    ? 'video/webm;codecs=vp9'
                    : 'video/webm';
                const recorder = new MediaRecorder(stream, { mimeType });
                const chunks = [];

                recorder.ondataavailable = (ev) => {
                    if (ev.data && ev.data.size > 0) chunks.push(ev.data);
                };
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `prime-torus-loop-${Date.now()}.webm`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                    isRecording = false;
                    recIndicator.style.display = 'none';
                };

                recorder.start();
                setTimeout(() => recorder.stop(), 5000);
            }
        });

        // --- 9. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const speed = parseFloat(sliderSpeed.value);
            simTime += dt * speed;

            torusGlassUniforms.uTime.value = simTime;
            knotGroup.rotation.z += 0.14 * dt * speed;
            torusMesh.rotation.z += 0.14 * dt * speed;
            torusGlassMesh.rotation.z += 0.14 * dt * speed;

            // Advance Golden Phase-Origin Singularity along the (p, q) geodesic
            const u = (simTime * 0.06) % 1.0;
            const curve = new PrimeTorusKnotCurve(currentP, currentQ, R_major, r_minor - 0.02);
            const pt = curve.getPoint(u);
            originMarker.position.copy(pt);
            pointLightGold.position.copy(pt).applyAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);

            for (let s = TRAIL_LEN - 1; s > 0; s--) {
                trailPoints[s].copy(trailPoints[s - 1]);
                trailPositions[s * 3] = trailPoints[s].x;
                trailPositions[s * 3 + 1] = trailPoints[s].y;
                trailPositions[s * 3 + 2] = trailPoints[s].z;
            }
            trailPoints[0].copy(pt);
            trailPositions[0] = pt.x;
            trailPositions[1] = pt.y;
            trailPositions[2] = pt.z;
            trailGeo.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateLayoutOffset();
        });

        animate();
    </script>
</body>
</html>
