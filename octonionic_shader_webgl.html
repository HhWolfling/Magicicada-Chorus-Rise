<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8D OCTONIONIC SHADER ENGINE (FANO PLANE GLSL)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #05050A;
            color: #00FFCC;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 20, 0.88);
            border: 1px solid #1A2B4C;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            backdrop-filter: blur(8px);
            width: 330px;
        }
        h1 {
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #00FFCC;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 10px;
            color: #FF007F;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8A9BA8;
            margin-bottom: 4px;
        }
        input[type=range] {
            width: 100%;
            accent-color: #00FFCC;
            background: #121C2B;
            height: 4px;
            border-radius: 2px;
        }
        .telemetry {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid #121C2B;
            font-size: 10px;
            color: #FFD700;
            line-height: 1.5;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00FFCC;
            border-radius: 3px;
            color: #00FFCC;
            font-size: 9px;
            margin-top: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h1>8D Octonionic Engine</h1>
        <h2>GLSL Fano Plane Raymarching (O)</h2>

        <div class="control-group">
            <label>Prime Brood P (p): <span id="val-p">13</span></label>
            <input type="range" id="slider-p" min="1" max="31" step="1" value="13">
        </div>

        <div class="control-group">
            <label>Prime Brood Q (q): <span id="val-q">17</span></label>
            <input type="range" id="slider-q" min="1" max="37" step="1" value="17">
        </div>

        <div class="control-group">
            <label>Field Density Scale: <span id="val-density">1.5</span></label>
            <input type="range" id="slider-density" min="0.5" max="3.0" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <label>Phase Velocity (τ): <span id="val-speed">1.0</span></label>
            <input type="range" id="slider-speed" min="0" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="telemetry">
            <div>Fano Triads: 7 Directed Imaginary Lines</div>
            <div>Algebra: Non-Associative Octonionic ($\mathbb{O}$)</div>
            <div>GPU Compute: Parallel GLSL Raymarching</div>
            <div class="status-badge">STATE: 8D HYPERCOMPLEX FIELD ACTIVE</div>
        </div>
    </div>

    <script>
        // --- 1. GLSL SHADER DEFINITIONS ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 u_resolution;
            uniform float u_time;
            uniform float u_p;
            uniform float u_q;
            uniform float u_density_scale;

            varying vec2 vUv;

            // Compute 8D Octonionic Fano Field Isosurface
            float octonionFanoField(vec3 pos) {
                float x0 = length(pos) - 1.2;
                float x1 = pos.x * cos(u_time * 0.4 + u_p * 0.1);
                float x2 = pos.y * sin(u_time * 0.4 + u_q * 0.1);
                float x3 = pos.z * cos(u_time * 0.3);
                float x4 = sin(pos.x * (u_p / 13.0) + u_time);
                float x5 = cos(pos.y * (u_q / 17.0) - u_time);
                float x6 = sin(pos.z * 1.5);
                float x7 = cos(length(pos.xy) * 3.0 - u_time * 0.5);

                // Fano Triad Non-Associative Couplings
                float t1 = (x1 * x2 - x3) + (x1 * x4 - x5);
                float t2 = (x1 * x7 - x6) + (x2 * x4 - x6);
                float t3 = (x2 * x5 - x7) + (x3 * x4 - x7);
                float t4 = (x3 * x6 - x5);

                float norm8D = sqrt(x0*x0 + x1*x1 + x2*x2 + x3*x3 + x4*x4 + x5*x5 + x6*x6 + x7*x7);
                
                // Measure deviation from hypercomplex shell boundary (Isosurface at R ~ 1.8)
                return abs(norm8D - 1.8) + 0.05 * (t1 + t2 + t3 + t4);
            }

            void main() {
                vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

                // Shift Ray Origin left (-0.65) so the manifold moves to the right half of the canvas
                vec3 ro = vec3(-0.65, 0.0, 3.2); 
                vec3 rd = normalize(vec3(st, -1.0)); 

                float t = 0.0;
                float density = 0.0;

                // GPU Raymarching Loop
                for (int i = 0; i < 64; i++) {
                    vec3 p = ro + rd * t;
                    float d = octonionFanoField(p);
                    
                    if (d < 0.35) {
                        density += (0.35 - d) * u_density_scale * 0.8;
                    }
                    t += max(d * 0.15, 0.02);
                    if (t > 5.0) break;
                }

                // Palette: Pitch-black background (#05050A) to Cyan, Magenta, Gold
                vec3 bg = vec3(0.02, 0.02, 0.04);
                vec3 cyan = vec3(0.0, 1.0, 0.8);
                vec3 magenta = vec3(1.0, 0.0, 0.5);
                vec3 gold = vec3(1.0, 0.84, 0.0);

                vec3 color = mix(bg, cyan, clamp(density, 0.0, 1.0));
                color += magenta * pow(clamp(density - 0.4, 0.0, 1.0), 1.8) * 1.8;
                color += gold * pow(clamp(density - 0.9, 0.0, 1.0), 2.5) * 2.0;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- 2. THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. SHADER MATERIAL & FULL-SCREEN QUAD ---
        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_time: { value: 0.0 },
            u_p: { value: 13.0 },
            u_q: { value: 17.0 },
            u_density_scale: { value: 1.5 }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms
        });

        const planeGeo = new THREE.PlaneGeometry(2, 2);
        const planeMesh = new THREE.Mesh(planeGeo, material);
        scene.add(planeMesh);

        // --- 4. UI LISTENERS ---
        const sliderP = document.getElementById('slider-p');
        const sliderQ = document.getElementById('slider-q');
        const sliderDensity = document.getElementById('slider-density');
        const sliderSpeed = document.getElementById('slider-speed');

        sliderP.addEventListener('input', () => {
            uniforms.u_p.value = parseFloat(sliderP.value);
            document.getElementById('val-p').innerText = sliderP.value;
        });
        sliderQ.addEventListener('input', () => {
            uniforms.u_q.value = parseFloat(sliderQ.value);
            document.getElementById('val-q').innerText = sliderQ.value;
        });
        sliderDensity.addEventListener('input', () => {
            uniforms.u_density_scale.value = parseFloat(sliderDensity.value);
            document.getElementById('val-density').innerText = parseFloat(sliderDensity.value).toFixed(1);
        });
        sliderSpeed.addEventListener('input', () => {
            document.getElementById('val-speed').innerText = parseFloat(sliderSpeed.value).toFixed(1);
        });

        // --- 5. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const speed = parseFloat(sliderSpeed.value);
            uniforms.u_time.value += clock.getDelta() * speed;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
